bundle:
  name: musica_billboard_final

variables:
  catalog:
    default: musica_saenz
  schema_prefix:
    default: ''

workspace:
  host: https://dbc-817cb94c-e059.cloud.databricks.com

sync:
  exclude:
    - data/**
    - docs/**
    - scripts/**
    - evidence/**
    - .github/**

resources:
  jobs:
    music_pipeline:
      name: musica_billboard_final
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema_prefix
          default: ${var.schema_prefix}
      tags:
        project: musica_billboard_final
        course: modulo4
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/${var.schema_prefix}bronze/landing/charts/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: bronze
          max_retries: 1
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/03_gold.py
        - task_key: governance
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ./notebooks/04_gobernanza.py
        - task_key: observability
          depends_on:
            - task_key: governance
          notebook_task:
            notebook_path: ./notebooks/05_observabilidad.py

targets:
  dev:
    mode: development
    default: true
    variables:
      schema_prefix: dev_
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/musica_billboard_final/prod
